[project]
name = "autositemap"
version = "0.1.0"
description = "Crawl an authenticated website and generate a visual navigation map for Figma"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.49",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
autositemap = "autositemap.cli:main"

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: marks tests as slow (requires browser)"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
